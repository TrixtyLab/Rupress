name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Distribution tag (defaults to latest)"
        required: false
        default: latest

# The packages of the repository need write access, and the provenance
# attestation needs the identity of the workflow.
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS arm64 + x64
            os: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (release)
        run: pnpm build:release

      # One macOS runner builds both architectures: rustc can cross-compile
      # between Apple Silicon and Intel with the same Xcode toolchain.
      - name: Build the other macOS architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          target="x86_64-apple-darwin"
          if [ "${{ runner.arch }}" != "ARM64" ]; then
            target="aarch64-apple-darwin"
          fi
          rustup target add "$target"
          node ./scripts/build.js --release --target "$target"

      - name: Test
        run: pnpm test
        env:
          OPENSSL_PATH: /usr/bin/openssl

      - name: Upload the native binaries
        uses: actions/upload-artifact@v4
        with:
          name: rupress-${{ runner.os }}
          path: dist/*.node
          if-no-files-found: error

  publish:
    name: Publish to GitHub Packages
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      # Every platform builds its own binary; the publish job merges them into
      # dist/ so the published package works on Windows, Linux and macOS.
      - name: Download the native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: rupress-*
          path: dist
          merge-multiple: true

      - name: Assemble the package
        run: pnpm build:js

      - name: Verify the tag matches the version of the package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the package version v$version" >&2
            exit 1
          fi

      - name: Run the tests
        run: pnpm test
        env:
          OPENSSL_PATH: /usr/bin/openssl

      # `prepack` verifies that all the platform binaries are present before
      # pnpm creates the tarball, so an incomplete package is never published.
      - name: Publish
        run: pnpm publish --provenance --no-git-checks --tag "${{ github.event.inputs.tag || 'latest' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
